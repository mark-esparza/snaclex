name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # SnaCleX targets 3.12 (see runtime.txt) but is stdlib-only, so it
        # should run cleanly across modern Pythons.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # SnaCleX is dependency-free; this keeps parity with the Render build.
        run: pip install -r requirements.txt

      - name: Byte-compile all sources
        run: python -m compileall -q server.py snaclex tests

      - name: Syntax-check the front end
        # app.js is the largest source file in the repo and is otherwise only
        # exercised by the separate (Playwright) e2e workflow, so a plain parse
        # here catches a broken bundle on every push for free.
        run: for f in web/*.js; do node --check "$f"; done

      - name: Set up Node
        # The Studio tests use `node --test` with a glob pattern (Node >= 21).
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax-check the Studio modules
        run: find web/studio -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run Studio unit tests
        # Node's built-in runner; the Studio is plain ES modules with no deps.
        run: node --test 'web/studio/test/*.test.js'

      - name: Run test suite
        run: python -m unittest discover -s tests -v
